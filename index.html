<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lord VPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #263e71 0, transparent 38%),
        linear-gradient(135deg, #090d18, #111827);
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 36px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(18, 25, 43, 0.88);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      font-size: 36px;
      background: linear-gradient(135deg, #4f8cff, #7c4dff);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    p {
      margin: 0 auto 26px;
      max-width: 470px;
      color: #b7c1d6;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      background: #3978ff;
      transition: 0.2s;
    }

    .button:hover {
      background: #5b91ff;
      transform: translateY(-2px);
    }

    .info {
      margin-top: 28px;
      padding: 16px;
      color: #9eabc4;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">⚡</div>

    <h1>Lord VPN</h1>

    <p>
      Быстрое и удобное подключение к VPN-серверам.
      Используйте ссылку подписки в приложении Happ.
    </p>

    <a class="button" href="https://t.me/xokeza" target="_blank">
      Поддержка в Telegram
    </a>

    <div class="info">
      Подписка автоматически обновляется через приложение Happ.
    </div>
  </main>
</body>
</html>
